version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # sha2 0.11.1 and later declare rust-version 1.88, above this crate's
    # 1.85 floor (docs/POLICIES.md); 0.11.0 is the newest within it. It is
    # a dev-dependency (the kit checksum test), so it does not justify
    # raising the MSRV. Drop this when the floor reaches 1.88.
    ignore:
      - dependency-name: "sha2"
        versions: [">= 0.11.1"]

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # The server version is pinned to the kit's core release; it moves
    # with the suite, not on its own.
    ignore:
      - dependency-name: "pain001"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
