version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # The server version is pinned to the kit's core release; it moves
    # with the suite, not on its own.
    ignore:
      - dependency-name: "pain001"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
