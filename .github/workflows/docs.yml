# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The user manual: MkDocs Material from docs/ (strict), the rustdoc API
# reference under /api/, an offline link check and the author footer
# check, all in scripts/build-manual.sh. Built on every pull request and
# push; deployed to GitHub Pages from main by the official Pages actions.
#
# The deploy job waits for the maintainer: it runs only when the
# repository variable PAGES_ENABLED is "true", set after switching
# Settings > Pages > Source to "GitHub Actions" (DEVELOPMENT.md).
name: Manual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: lychee@0.24.2
      # Hash-checked, so nothing but the reviewed artefacts can install.
      - name: Install MkDocs
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install --quiet --require-hashes \
            -r docs/requirements.txt
      - name: Build, link check, footer check
        env:
          MKDOCS: ${{ runner.temp }}/docs/bin/mkdocs
        run: scripts/build-manual.sh
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
