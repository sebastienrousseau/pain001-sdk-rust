# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "pain001-sdk"
version = "0.0.88"
edition = "2021"
rust-version = "1.85"
description = "Typed blocking client for the pain001 REST API (ISO 20022 pain.001 and pain.008)"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sebastienrousseau/pain001-sdk-rust"
homepage = "https://pain001.com"
readme = "README.md"
keywords = ["iso20022", "pain001", "payments", "sepa", "client"]
categories = ["api-bindings", "finance"]
publish = false
# What the package ships: the library, its tests, examples and benches
# with the kit they read, and the licences. The README demo, fuzz/,
# docs/, scripts/ and CI files stay in the repository.
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/examples/**/*.rs",
  "/benches/**/*.rs",
  "/benches/responses/*.json",
  "/conformance/**",
]

[lib]
name = "pain001_sdk"

[features]
default = ["tls"]
# HTTPS through rustls (ring provider). Drop it with
# `default-features = false` to talk to a loopback server over plain HTTP.
tls = ["ureq/rustls"]
# Exposes `pain001_sdk::fuzzing`, the request encoding and response
# decoding without the network, for this repository's benches. Not public
# API: hidden from the docs and free to change in any release.
internals = []

# cargo-fuzz builds with `--cfg fuzzing`, which compiles src/fuzzing.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.1", default-features = false }

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }
sha2 = "0.11.0"

# Client-side cost, no network: `make bench` (needs the internals feature).
[[bench]]
name = "client"
harness = false
required-features = ["internals"]

# Loopback round trips against PAIN001_BASE_URL; skipped without it.
[[bench]]
name = "roundtrip"
harness = false
